<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Poly Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            color: white;
            pointer-events: all;
            min-width: 400px;
        }
        
        #menu h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        
        #menu input, #menu button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
        }
        
        #menu button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        
        #menu button:hover {
            background: #45a049;
        }
        
        #server-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 10px 0;
            border: 1px solid #333;
            border-radius: 5px;
        }
        
        .server-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            margin: 5px;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .server-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        #hud {
            display: none;
            pointer-events: none;
        }
        
        #hud.active {
            display: block;
        }
        
        #health {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        
        #ammo {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        
        #scoreboard {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            color: white;
            min-width: 200px;
        }
        
        #scoreboard h3 {
            margin-bottom: 10px;
            border-bottom: 1px solid white;
            padding-bottom: 5px;
        }
        
        .score-item {
            padding: 5px 0;
            display: flex;
            justify-content: space-between;
        }
        
        #chat-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 300px;
            pointer-events: all;
        }
        
        #chat-messages {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            height: 200px;
            overflow-y: auto;
            margin-bottom: 5px;
            color: white;
        }
        
        .chat-message {
            margin: 5px 0;
            word-wrap: break-word;
        }
        
        .chat-message .player-name {
            font-weight: bold;
            color: #4CAF50;
        }
        
        #chat-input {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
        }
        
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: white;
        }
        
        #crosshair::before {
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            transform: translateY(-50%);
        }
        
        #crosshair::after {
            left: 50%;
            top: 0;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui">
        <div id="menu">
            <h1>Low-Poly Shooter</h1>
            <input type="text" id="player-name" placeholder="Enter your name" value="Player">
            <input type="text" id="room-name" placeholder="Room name (optional)">
            <button id="create-room-btn">Create Room</button>
            <button id="join-room-btn">Join Room</button>
            <h3 style="margin-top: 20px;">Available Rooms</h3>
            <div id="server-list"></div>
        </div>
        
        <div id="hud">
            <div id="health">❤️ Health: <span id="health-value">100</span></div>
            <div id="ammo">🔫 Ammo: <span id="ammo-value">30</span></div>
            <div id="crosshair"></div>
            
            <div id="scoreboard">
                <h3>Scoreboard</h3>
                <div id="score-list"></div>
            </div>
            
            <div id="chat-container">
                <div id="chat-messages"></div>
                <input type="text" id="chat-input" placeholder="Press Enter to chat...">
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>
